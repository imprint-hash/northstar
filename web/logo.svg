<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" role="img" aria-label="Northstar">
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFEFFF"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ADCF7"/><stop offset="1" stop-color="#3C97CF"/></linearGradient>
    <linearGradient id="dimLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD0EE"/><stop offset="1" stop-color="#4E9CC8"/></linearGradient>
    <linearGradient id="dimShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C9AC6"/><stop offset="1" stop-color="#235D8A"/></linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E4F7FF" stop-opacity="0.9"/><stop offset="1" stop-color="#7FD4F5" stop-opacity="0"/></radialGradient>
    <!-- a ray pointing up from the centre: lit left half, shaded right half -->
    <g id="ray"><path d="M120 0 L108 108 L120 120 Z" fill="url(#lit)"/><path d="M120 0 L132 108 L120 120 Z" fill="url(#shade)"/></g>
    <g id="minor"><path d="M120 0 L112 112 L120 120 Z" fill="url(#dimLit)"/><path d="M120 0 L128 112 L120 120 Z" fill="url(#dimShade)"/></g>
  </defs>
  <g fill="none" stroke="#7FD4F5">
    <circle cx="120" cy="120" r="88" stroke-width="1.4" stroke-opacity="0.35"/>
    <circle cx="120" cy="120" r="74" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="1.5 5.5"/>
  </g>
  <!-- secondary rays on the diagonals, short -->
  <g>
    <use xlink:href="#minor" transform="translate(120 120) rotate(45) scale(0.52) translate(-120 -120)"/>
    <use xlink:href="#minor" transform="translate(120 120) rotate(135) scale(0.52) translate(-120 -120)"/>
    <use xlink:href="#minor" transform="translate(120 120) rotate(225) scale(0.52) translate(-120 -120)"/>
    <use xlink:href="#minor" transform="translate(120 120) rotate(315) scale(0.52) translate(-120 -120)"/>
  </g>
  <!-- cardinal rays: north longest, south next, east and west shortest -->
  <use xlink:href="#ray" transform="translate(120 120) scale(1.0) translate(-120 -120)"/>
  <use xlink:href="#ray" transform="translate(120 120) rotate(180) scale(0.82) translate(-120 -120)"/>
  <use xlink:href="#ray" transform="translate(120 120) rotate(90) scale(0.74) translate(-120 -120)"/>
  <use xlink:href="#ray" transform="translate(120 120) rotate(270) scale(0.74) translate(-120 -120)"/>
  <circle cx="120" cy="120" r="18" fill="url(#core)"/>
  <circle cx="120" cy="120" r="4.5" fill="#FFFFFF"/>
</svg>
